<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="School MIS is offline." />
    <title>Offline | School MIS</title>
    <style>
      :root {
        --bg: #0b0e14;
        --card: rgba(255, 255, 255, 0.06);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.7);
        --border: rgba(255, 255, 255, 0.12);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7fb;
          --card: rgba(0, 0, 0, 0.04);
          --text: rgba(0, 0, 0, 0.92);
          --muted: rgba(0, 0, 0, 0.6);
          --border: rgba(0, 0, 0, 0.12);
        }
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        background: radial-gradient(1200px 600px at 20% -10%, rgba(110, 90, 255, 0.22), transparent 55%),
          radial-gradient(900px 500px at 90% 10%, rgba(30, 205, 255, 0.16), transparent 55%),
          var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(720px, 100%);
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: 18px;
        padding: 22px 22px 18px;
        backdrop-filter: blur(12px);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        line-height: 1.2;
      }
      p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.6;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      button {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.08);
        color: inherit;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 650;
        cursor: pointer;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .hint {
        font-size: 12px;
        margin-top: 10px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>School MIS can't reach the network right now. Some cached pages may still work.</p>
      <div class="row">
        <button type="button" onclick="location.reload()">Retry</button>
        <button type="button" onclick="location.href='/'">Go to home</button>
      </div>
      <div class="hint">This page is shown by the service worker when a navigation request fails.</div>
    </div>
  </body>
</html>
