<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="1" stop-color="#0b0f19" stop-opacity="0.35" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0b0f19" />
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="980" cy="150" r="220" fill="#4f46e5" opacity="0.28" filter="url(#blur)" />
  <circle cx="250" cy="520" r="260" fill="#ffffff" opacity="0.10" filter="url(#blur)" />

  <text x="80" y="290" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="88" font-weight="800" fill="#ffffff">School MIS</text>
  <text x="80" y="360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="38" font-weight="500" fill="#ffffff" opacity="0.92">School Management Information System</text>
</svg>
